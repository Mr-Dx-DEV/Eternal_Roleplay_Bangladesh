<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Background Video</title>
    <style>
        /* Prevent side scrollbar and ensure full height for background */
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }

        /* Fullscreen background video container */
        .fullscreen-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Fullscreen video iframe */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Style for the 'Press Space to toggle music' text */
        .enable_music {
            text-align: center;
            color: rgba(255, 255, 255, 0.849);
            font-family: 'Arial', sans-serif;
            font-size: 18px; /* Smaller font size */
            position: absolute;
            bottom: 07px; /* Move the text further down */
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            opacity: 0; /* Initially hidden */
            animation: fadeIn 2s forwards 7s; /* Delay for 7 seconds, then fade in */
        }

        /* Keyframes for the fade-in animation */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- YOUTUBE BACKGROUND VIDEO -->
    <div class="fullscreen-bg">
        <iframe 
            id="ytplayer"
            src="https://www.youtube.com/embed/HKKXWx5fsbk?autoplay=1&mute=1&controls=0&loop=1&playlist=HKKXWx5fsbk&modestbranding=1&iv_load_policy=3&rel=0&fs=0&enablejsapi=1" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>    
    </div>
    <!-- END YOUTUBE BACKGROUND VIDEO -->

    <!-- HEADING -->
    <h1 class="enable_music">
        <strong>Press Space to toggle music</strong>
    </h1>

    <!-- BACKGROUND AUDIO CONTROL -->
    <script>
        let isMuted = true;

        // Function to toggle mute/unmute
        function toggleAudio() {
            const iframe = document.getElementById("ytplayer");
            const message = isMuted 
                ? '{"event":"command","func":"unMute","args":""}' 
                : '{"event":"command","func":"mute","args":""}';
            iframe.contentWindow.postMessage(message, "*");
            isMuted = !isMuted;
        }

        // Listen for spacebar to toggle audio
        window.addEventListener("keydown", function (event) {
            if (event.code === "Space") {
                toggleAudio();
                event.preventDefault(); // Prevent scrolling on spacebar
            }
        });
    </script>
    <!-- END BACKGROUND AUDIO CONTROL -->
</body>
</html>
